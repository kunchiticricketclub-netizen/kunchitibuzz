<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KunchitiBuzz Admin Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f8;
    color:#17202a;
}

/* HEADER */
.header{
    background:#075e54;
    color:white;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#ffd43b;
}

.admin-label{
    font-size:13px;
    opacity:.9;
}

/* MAIN */
.container{
    max-width:1100px;
    margin:auto;
    padding:22px;
}

.welcome{
    margin-bottom:22px;
}

.welcome h1{
    font-size:26px;
    margin-bottom:6px;
}

.welcome p{
    color:#667085;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.stat-icon{
    font-size:28px;
    margin-bottom:10px;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
}

.stat-title{
    color:#667085;
    margin-top:4px;
}

/* MENU */
.section-title{
    font-size:21px;
    margin:25px 0 14px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.menu-card{
    background:white;
    border:0;
    border-radius:16px;
    padding:22px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.menu-card:hover{
    transform:translateY(-3px);
}

.menu-icon{
    font-size:32px;
    margin-bottom:12px;
}

.menu-card h3{
    margin-bottom:6px;
}

.menu-card p{
    color:#667085;
    font-size:14px;
    line-height:1.4;
}

/* CONTENT PANEL */
.panel{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-top:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.panel h2{
    margin-bottom:10px;
}

.panel p{
    color:#667085;
    margin-bottom:18px;
}

/* BUTTON */
.btn{
    border:0;
    background:#075e54;
    color:white;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#064c44;
}

/* MOBILE */
@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){

    .container{
        padding:15px;
    }

    .header{
        padding:15px;
    }

    .logo{
        font-size:20px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat-number{
        font-size:23px;
    }

    .menu{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">
        Kunchiti<span>Buzz</span> 🏏
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

</header>


<main class="container">

    <!-- WELCOME -->
    <div class="welcome">
        <h1>Welcome, Admin 👋</h1>
        <p>Manage your KunchitiBuzz cricket platform from here.</p>
    </div>


    <!-- STATISTICS -->
    <div class="stats">

        <div class="stat">
            <div class="stat-icon">🏏</div>
            <div class="stat-number">0</div>
            <div class="stat-title">Teams</div>
        </div>

        <div class="stat">
            <div class="stat-icon">👤</div>
            <div class="stat-number">0</div>
            <div class="stat-title">Players</div>
        </div>

        <div class="stat">
            <div class="stat-icon">📅</div>
            <div class="stat-number">0</div>
            <div class="stat-title">Matches</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🏆</div>
            <div class="stat-number">0</div>
            <div class="stat-title">Tournaments</div>
        </div>

    </div>


    <!-- MANAGEMENT -->
    <h2 class="section-title">Management</h2>

    <div class="menu">

        <button class="menu-card" onclick="openSection('Teams')">
            <div class="menu-icon">🏏</div>
            <h3>Teams</h3>
            <p>Add and manage cricket teams.</p>
        </button>


        <button class="menu-card" onclick="openSection('Players')">
            <div class="menu-icon">👤</div>
            <h3>Players</h3>
            <p>Manage players and player profiles.</p>
        </button>


        <button class="menu-card" onclick="openSection('Matches')">
            <div class="menu-icon">📅</div>
            <h3>Matches</h3>
            <p>Create fixtures and manage match results.</p>
        </button>


        <button class="menu-card" onclick="openSection('Tournaments')">
            <div class="menu-icon">🏆</div>
            <h3>Tournaments</h3>
            <p>Create and manage cricket tournaments.</p>
        </button>


        <button class="menu-card" onclick="openSection('Points Table')">
            <div class="menu-icon">📊</div>
            <h3>Points Table</h3>
            <p>Manage tournament standings.</p>
        </button>


        <button class="menu-card" onclick="openSection('Live Score')">
            <div class="menu-icon">🔴</div>
            <h3>Live Score</h3>
            <p>Manage live match scoring.</p>
        </button>


        <button class="menu-card" onclick="openSection('Photos & Videos')">
            <div class="menu-icon">📸</div>
            <h3>Photos & Videos</h3>
            <p>Manage match photos, videos and winning moments.</p>
        </button>


        <button class="menu-card" onclick="openSection('News')">
            <div class="menu-icon">📰</div>
            <h3>News & Posts</h3>
            <p>Create cricket news and announcements.</p>
        </button>


        <button class="menu-card" onclick="logout()">
            <div class="menu-icon">🚪</div>
            <h3>Logout</h3>
            <p>Return to the KunchitiBuzz website.</p>
        </button>

    </div>


    <!-- INFORMATION PANEL -->
    <div class="panel" id="panel">

        <h2>Admin Dashboard</h2>

        <p>
            Select a management option above to continue.
        </p>

        <button class="btn" onclick="openSection('Live Score')">
            🔴 Open Live Score
        </button>

    </div>

</main>


<script>

function openSection(section){

    const panel = document.getElementById("panel");

    panel.innerHTML = `
        <h2>${section}</h2>

        <p>
            The ${section} management section is ready.
        </p>

        <button class="btn" onclick="goBack()">
            ← Back to Dashboard
        </button>
    `;

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}


function goBack(){

    location.reload();

}


function logout(){

    const confirmLogout =
        confirm("Do you want to leave the Admin Panel?");

    if(confirmLogout){

        window.location.href = "index.html";

    }

}

</script>

</body>
</html>
